name: V1 PrintService Printer Name Command Boundary

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "EXACT_HEAD=$(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Locked install
        run: npm ci --no-audit --no-fund

      - name: Production syntax check
        run: node --check server.js

      - name: Focused runtime syntax check
        run: node --check tests/printer-name-command-boundary-runtime.mjs

      - name: Real PrintService command-boundary runtime
        run: node tests/printer-name-command-boundary-runtime.mjs
