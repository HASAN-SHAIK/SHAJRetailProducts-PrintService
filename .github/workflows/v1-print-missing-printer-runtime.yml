name: V1 PrintService Missing Printer Runtime

on:
  pull_request:
    paths:
      - "server.js"
      - "package.json"
      - "package-lock.json"
      - "tests/printer-not-found-runtime.mjs"
      - ".github/workflows/v1-print-missing-printer-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact head
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          echo "PRINTSERVICE_EXACT_HEAD=$(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Locked install
        run: npm ci --no-audit --no-fund

      - name: Smallest relevant automated checks
        run: |
          node --check server.js
          node --check tests/printer-not-found-runtime.mjs

      - name: Real PrintService missing-printer runtime
        run: node tests/printer-not-found-runtime.mjs
